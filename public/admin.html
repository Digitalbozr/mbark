<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkPilot | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="admin-page">
  <main class="container py-4 py-md-5">
    <header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-end gap-3 mb-4">
      <div>
        <p class="eyebrow mb-2">LINKPILOT / CONTROL CENTER</p>
        <h1 class="display-6 fw-bold mb-1">Your redirect links</h1>
        <p class="text-secondary mb-0">Create, monitor, and manage simple timed redirects.</p>
      </div>
      <span id="link-count" class="status-pill">0 links</span>
    </header>

    <section class="create-panel mb-4">
      <div class="row align-items-center g-4">
        <div class="col-lg-4">
          <p class="eyebrow mb-2">NEW REDIRECT</p>
          <h2 class="h4 mb-2">Where should visitors go?</h2>
          <p class="text-secondary mb-0 small">Use a complete HTTP or HTTPS destination URL.</p>
        </div>
        <div class="col-lg-8">
          <form id="link-form" class="row g-2">
            <div class="col-md">
              <label class="visually-hidden" for="destination">Destination URL</label>
              <input id="destination" name="destination" class="form-control form-control-lg" type="url" placeholder="https://example.com/page" required>
            </div>
            <div class="col-md-auto">
              <button class="btn btn-primary btn-lg w-100" type="submit">Create link <span aria-hidden="true">&#8599;</span></button>
            </div>
          </form>
          <div id="form-message" class="small mt-2" role="alert"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Generated links</h2>
        <button id="refresh-button" class="btn btn-sm btn-outline-secondary" type="button">Refresh</button>
      </div>
      <div id="links-list" class="links-list" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#link-form');
    const destinationInput = document.querySelector('#destination');
    const formMessage = document.querySelector('#form-message');
    const linksList = document.querySelector('#links-list');
    const linkCount = document.querySelector('#link-count');

    function redirectUrl(code) {
      return `${window.location.origin}/go/${encodeURIComponent(code)}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;'
      })[character]);
    }

    function renderLinks(links) {
      linkCount.textContent = `${links.length} link${links.length === 1 ? '' : 's'}`;
      if (!links.length) {
        linksList.innerHTML = '<div class="empty-state">No redirects yet. Create your first one above.</div>';
        return;
      }

      linksList.innerHTML = links.map((link) => {
        const url = redirectUrl(link.code);
        return `<article class="link-row">
          <div class="link-main">
            <div class="d-flex align-items-center gap-2 mb-2"><span class="code-label">/go/${escapeHtml(link.code)}</span><span class="click-badge">${link.clicks} click${link.clicks === 1 ? '' : 's'}</span></div>
            <a class="destination" href="${escapeHtml(link.destination)}" target="_blank" rel="noreferrer">${escapeHtml(link.destination)}</a>
            <div class="redirect-url">${escapeHtml(url)}</div>
          </div>
          <div class="link-actions">
            <button class="btn btn-sm btn-outline-primary copy-button" data-url="${escapeHtml(url)}" type="button">Copy</button>
            <button class="btn btn-sm btn-outline-danger delete-button" data-id="${escapeHtml(link.id)}" type="button">Delete</button>
          </div>
        </article>`;
      }).join('');
    }

    async function loadLinks() {
      linksList.innerHTML = '<div class="empty-state">Loading links...</div>';
      try {
        const response = await fetch('/api/links');
        if (!response.ok) throw new Error('Loading failed');
        renderLinks(await response.json());
      } catch {
        linksList.innerHTML = '<div class="alert alert-danger">Could not load links. Is the server running?</div>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formMessage.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ destination: destinationInput.value.trim() }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        destinationInput.value = '';
        formMessage.className = 'small mt-2 text-success';
        formMessage.textContent = 'Redirect link created.';
        await loadLinks();
      } catch (error) {
        formMessage.className = 'small mt-2 text-danger';
        formMessage.textContent = error.message;
      } finally { button.disabled = false; }
    });

    linksList.addEventListener('click', async (event) => {
      const copyButton = event.target.closest('.copy-button');
      if (copyButton) {
        await navigator.clipboard.writeText(copyButton.dataset.url);
        copyButton.textContent = 'Copied';
        setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
      }
      const deleteButton = event.target.closest('.delete-button');
      if (deleteButton && window.confirm('Delete this redirect link?')) {
        const response = await fetch(`/api/links/${encodeURIComponent(deleteButton.dataset.id)}`, { method: 'DELETE' });
        if (response.ok) loadLinks();
      }
    });

    document.querySelector('#refresh-button').addEventListener('click', loadLinks);
    loadLinks();
  </script>
</body>
</html>
