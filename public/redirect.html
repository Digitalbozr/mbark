<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preparing your destination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="redirect-page">
  <main class="waiting-card text-center">
    <div class="signal-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="eyebrow mb-3">LINKPILOT</p>
    <h1 class="display-6 fw-bold mb-3">Please wait...</h1>
    <p class="text-secondary mb-4">You will be redirected in <strong id="countdown">3</strong> seconds.</p>
    <div class="progress" role="progressbar" aria-label="Redirect countdown"><div id="progress-bar" class="progress-bar"></div></div>
    <p class="small text-secondary mt-3 mb-0">Your destination is opening securely.</p>
  </main>
  <script>
    const destination = __DESTINATION__;
    const countdown = document.querySelector('#countdown');
    const progressBar = document.querySelector('#progress-bar');
    let seconds = 3;
    const timer = setInterval(() => {
      seconds -= 1;
      countdown.textContent = seconds;
      progressBar.style.width = `${((3 - seconds) / 3) * 100}%`;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script>
</body>
</html>
